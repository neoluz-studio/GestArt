<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Presupuesto {{quote_number}}</title><style>:root{--primary:{{primary_color}};--accent:{{accent_color}}}body{font-family:Arial,sans-serif;color:#211f2a;padding:32px}header{display:flex;justify-content:space-between;border-bottom:3px solid var(--primary);padding-bottom:18px}table{width:100%;border-collapse:collapse;margin-top:24px}th,td{padding:10px;border-bottom:1px solid #e7e4ec;text-align:left}.total{font-size:24px;font-weight:800;text-align:right;margin-top:20px}</style></head><body><header><div><img src="{{company_logo}}" alt="{{company_name}}" style="max-height:65px"><h1>{{company_name}}</h1><div>CUIT {{company_tax_id}}</div></div><div><strong>PRESUPUESTO {{quote_number}}</strong><div>{{quote_date}}</div></div></header><h2>Cliente: {{client_name}}</h2><table><thead><tr><th>Detalle</th><th>Cantidad</th><th>Precio</th><th>Total</th></tr></thead><tbody>{{items_rows}}</tbody></table><div class="total">TOTAL {{total}}</div><h3>Términos</h3><div>{{terms_and_conditions}}</div><footer>{{quote_footer}}</footer></body></html>
